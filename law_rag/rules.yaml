# 合同风险规则库（FR-6.3）——law_rag.review 的知识源。
#
# 字段说明：
#   id          规则标识（报告中的编号）
#   name        风险名称
#   level       风险等级：高 / 中 / 低
#   pattern     正则（对合同全文扫描，re.VERBOSE 不启用；避免回读歧义，模式保持简单）
#   explain     命中后的问题说明（写给非法律背景的用户看）
#   law_query   关联法条检索词（送入混合检索取依据，引用永远来自库内法规）
#   advice      建议改法
#
# 维护约定：新增规则时 law_query 必须是"知识库大概率能检索到"的表述，
# 否则报告里的依据一栏为空，宁缺毋滥（引用白名单原则同问答侧）。

rules:
  - id: R001
    name: 押金无条件不退 / 扣减无约定
    level: 高
    pattern: '押金[^。]{0,30}(不予退还|不予返还|概不退还|一律没收|不退)'
    explain: >
      押金具有担保性质，退还应按约定处理；除合同明确约定的扣减情形外，
      出租人/经营者无正当理由不得扣减，"一律不退"式条款涉嫌不公平格式条款。
    law_query: 住房租赁押金数额返还时间扣减情形
    advice: 改为"押金于合同终止且无损坏、无欠费时 X 日内原额退还，扣减情形限于：……（列举）"。

  - id: R002
    name: 定金与订金混用
    level: 中
    pattern: '(订金|预付款)[^。]{0,20}(不退|不予退还|视为定金)'
    explain: >
      "订金/预付款"在法律上不同于"定金"：定金适用双倍返还罚则（不超过主合同标的额 20%），
      订金仅是预付款。合同用"订金"之名行"定金不退"之实，属于概念混用的高发坑。
    law_query: 定金双倍返还主合同标的额百分之二十
    advice: 明确款项性质：要适用定金罚则就写"定金"并控制在标的额 20% 以内；否则写"预付款"并约定退还规则。

  - id: R003
    name: 违约金畸高
    level: 高
    pattern: '违约金?[^。]{0,24}?(百分之\s*(3[1-9]|[4-9]\d)|\d+倍|月租金的\s*[3-9]\s*倍)'
    explain: >
      约定违约金过分高于造成损失的，当事人可请求法院适当减少（司法实践常以超过损失 30% 为界）；
      "三倍月租金"式的违约金条款对违约方明显过苛。
    law_query: 违约金过分高于造成损失请求予以适当减少
    advice: 改为与实际损失相当的固定数额或比例（如月租金的 1 倍），并保留损失举证条款。

  - id: R004
    name: 排除对方主要权利的格式条款
    level: 高
    pattern: '(甲方|出租人|经营者)[^。]{0,40}(有权单方|有权随时)(解除|变更|调整|涨)'
    explain: >
      格式条款不得排除对方主要权利；"甲方有权随时解除/变更合同"使对方权利处于不确定状态，
      民法典与消费者权益保护法均给予否定评价。
    law_query: 格式条款排除对方主要权利无效
    advice: 解除/变更须附明确条件与通知义务（如"提前 30 日书面通知并补偿 X"）。

  - id: R005
    name: 最终解释权归商家
    level: 高
    pattern: '(最终解释权|最终解释)[^。]{0,10}(归|属于)(甲方|本公司|商家|经营者|出租人)'
    explain: >
      "最终解释权归经营者"是典型的违法格式条款：合同解释应按通行理解，经营者无单方最终解释权。
    law_query: 经营者不得作出排除限制消费者权利的格式条款
    advice: 删除该句；争议解决改为协商→调解→诉讼/仲裁的常规路径。

  - id: R006
    name: 概不退换 / 排除七日无理由退货
    level: 高
    pattern: '(概不退换|不予退换|不退不换|不支持七天无理由|非质量问题[^。]{0,10}退)'
    explain: >
      网络购物等法定情形下消费者享有七日无理由退货；商品有质量问题的，"概不退换"
      直接排除了法定权利，条款无效。
    law_query: 消费者七日无理由退货质量问题退货
    advice: 按法定标准写明退货范围、流程与运费承担，不得排除法定退货权。

  - id: R007
    name: 免除自身三包/质量责任
    level: 中
    pattern: '(质量问题|瑕疵)[^。]{0,24}(概不负责|不承担责任|免?[除责]|概不负责)'
    explain: >
      销售者对商品质量负有法定责任（三包：修理、更换、退货），约定期限内不得约定排除。
    law_query: 销售者修理更换退货三包责任
    advice: 写明三包期限与履行方式，不得声明免除质量责任。

  - id: R008
    name: 单方涨租 / 随意调价
    level: 中
    pattern: '((租金|价格)[^。]{0,20}(甲方有权|可|得)(随时)?(上调|调整|提高)|(甲方|出租人)[^。]{0,20}(有权|可|得)(随时)?[^。]{0,8}(上调|提高)(租金|价格))'
    explain: >
      租赁期内租金调整应有明确机制；"出租人可随时上调租金"让承租人支出处于不可预期状态，
      实践中常被认定不公平。
    law_query: 住房租赁合同租金调整约定
    advice: 改为"租期内租金不变；续租时涨幅不超过 X% 或双方另行协商"。

  - id: R009
    name: 放弃诉权 / 争议仅协商
    level: 高
    pattern: '(不得(提起)?(诉讼|仲裁|投诉|举报)|放弃(诉讼|仲裁|投诉)权|仅能协商解决)'
    explain: >
      诉权属法定权利，格式条款不能排除；消费者投诉举报渠道同样不容合同封堵。
    law_query: 格式条款排除消费者权利投诉举报
    advice: 改为"争议先行协商，协商不成可向法院起诉或按约定申请仲裁"。

  - id: R010
    name: 送达/通知条款缺席（低风险提示）
    level: 低
    pattern: '(本合同一式两份|签字之日起生效)'
    explain: >
      检测到合同收尾条款但未见送达/通知条款：解除、催告等意思表示的送达方式未约定，
      争议时举证成本会变高。
    law_query: 合同解除通知到达生效
    advice: 增补送达条款："本合同载明的联系方式为有效送达方式，包括解除、催告等通知自发出后 X 日视为送达。"
